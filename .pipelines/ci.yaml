---
trigger:
  - none

resources:
  repositories:
    - repository: templates
      type: git
      name: Azure-Landing-Zone-Platform/alz-mgmt-templates

parameters:
  - name: terraform_cli_version
    displayName: Terraform CLI Version
    type: string
    default: '1.14.9'

lockBehavior: sequential

extends:
  template: .pipelines/ci-template.yaml@templates
  parameters:
    root_module_folder_relative_path: .
    terraform_cli_version: ${{ coalesce(parameters.terraform_cli_version, 'latest') }}
